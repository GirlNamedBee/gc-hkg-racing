[project]
name = "hkracing"
version = "0.1.0"
description = "Win-probability model for Hong Kong racing"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5"]

[project.optional-dependencies]
model = ["pandas>=2", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hkracing = ["schema.sql"]
